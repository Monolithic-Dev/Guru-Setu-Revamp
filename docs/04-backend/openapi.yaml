components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string}
    StudentId:
      name: student_id
      in: path
      required: true
      schema: {type: string}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string}

  responses:
    Problem:
      description: Error (see code)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthenticated:
      description: UNAUTHENTICATED, TOKEN_EXPIRED or INVALID_CREDENTIALS
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: FORBIDDEN (role not allowed)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: NOT_FOUND (missing or out of scope)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: ALREADY_APPLIED, INVALID_TRANSITION, NOT_PRESENT, OPENING_CLOSED or ALREADY_REVIEWED
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationFailed:
      description: VALIDATION_FAILED or NOT_YOUR_MENTEE
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RateLimited:
      description: RATE_LIMITED (Retry-After header set)
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code:
          type: string
          enum: [UNAUTHENTICATED, TOKEN_EXPIRED, INVALID_CREDENTIALS, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED, VALIDATION_FAILED, NOT_ELIGIBLE,
                 NOT_YOUR_MENTEE, ALREADY_APPLIED, INVALID_TRANSITION, NOT_PRESENT, OPENING_CLOSED, ALREADY_REVIEWED,
                 FILE_TOO_LARGE, UNSUPPORTED_FILE_TYPE, RATE_LIMITED, DB_UNAVAILABLE, INTERNAL]
        request_id: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: {type: string}
              message: {type: string}

    Role:
      type: string
      enum: [student, faculty, hod, iqac]
    TopicCategory:
      type: string
      enum: [academic, attendance, career, research, personal, other]
    UserRef:
      type: object
      required: [user_id, name]
      properties:
        user_id: {type: string}
        name: {type: string}
    StatusEvent:
      type: object
      required: [to_status, actor_name, at]
      properties:
        from_status: {type: [string, 'null']}
        to_status: {type: string}
        actor_name: {type: string}
        note: {type: [string, 'null']}
        at: {type: string, format: date-time}

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 120}
        password: {type: string, minLength: 1, maxLength: 128}
    TokenResponse:
      type: object
      required: [access_token, token_type, role, user_id, expires_at]
      properties:
        access_token: {type: string}
        token_type: {type: string, const: bearer}
        role: {$ref: '#/components/schemas/Role'}
        user_id: {type: string}
        expires_at: {type: string, format: date-time}
    Me:
      type: object
      required: [user_id, name, email, role, dept_code]
      properties:
        user_id: {type: string}
        name: {type: string}
        email: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        dept_code: {type: string}

    SkillView:
      type: object
      required: [concept, trust_level, claimed, sources]
      properties:
        concept: {type: string}
        trust_level: {type: integer, enum: [0, 1, 2]}
        claimed: {type: boolean}
        sources:
          type: array
          items:
            type: object
            required: [evidence_id, title]
            properties:
              evidence_id: {type: string}
              title: {type: string}
        endorsed_by:
          type: array
          description: Display names of the faculty who endorsed this skill (trust level 2)
          items: {type: string}
    StudentProfile:
      type: object
      required: [user_id, name, roll_no, year, dept_code, interests, skills]
      properties:
        user_id: {type: string}
        name: {type: string}
        roll_no: {type: string}
        year: {type: integer, minimum: 1, maximum: 5}
        dept_code: {type: string}
        bio: {type: [string, 'null'], maxLength: 500}
        interests:
          type: array
          maxItems: 10
          items: {type: string, maxLength: 40}
        skills:
          type: array
          items: {$ref: '#/components/schemas/SkillView'}
    ProfilePatch:
      type: object
      additionalProperties: false
      properties:
        bio: {type: [string, 'null'], maxLength: 500}
        interests:
          type: array
          maxItems: 10
          items: {type: string, maxLength: 40}
        claimed_skills:
          type: array
          maxItems: 30
          description: Full list of claimed skill names; certified/endorsed skills are unaffected
          items: {type: string, minLength: 1, maxLength: 40}
        skill_levels:
          type: object
          description: Self-assessed level per skill name. It never changes a trust level.
          additionalProperties: {$ref: '#/components/schemas/SkillLevel'}
        programme: {oneOf: [{$ref: '#/components/schemas/Programme'}, {type: 'null'}]}
        year: {type: integer, minimum: 1, maximum: 5}
        headline: {type: [string, 'null'], maxLength: 120}
        self_reported_cgpa: {type: [number, 'null'], minimum: 0, maximum: 10, description: 'Labelled self-reported everywhere; never raises a trust level'}
        links:
          type: array
          maxItems: 5
          description: https URLs only
          items: {type: string, maxLength: 200}
        availability_hours: {type: [integer, 'null'], minimum: 0, maximum: 40}
        available_from: {type: [string, 'null'], format: date}
        preferences:
          type: array
          maxItems: 5
          items: {type: string, minLength: 1, maxLength: 30}
        open_to_opportunities: {type: boolean}
        projects:
          type: array
          maxItems: 10
          description: Full list; replaces the stored projects
          items: {$ref: '#/components/schemas/ProjectInput'}

    CertificateStatus:
      type: string
      enum: [processing, certified, needs_review, rejected, duplicate, failed]
    CertificateLevel:
      type: string
      enum: [international, national, state, university, college, online, other, unknown]
    CertificateType:
      type: string
      enum: [hackathon, course, workshop, competition, internship, paper, sports, cultural, other]
    Certificate:
      type: object
      required: [id, status, media_type, skills, reasons, created_at, updated_at]
      properties:
        id: {type: string}
        status: {$ref: '#/components/schemas/CertificateStatus'}
        media_type: {type: string, enum: [image/jpeg, image/png, application/pdf]}
        holder_name: {type: [string, 'null']}
        title: {type: [string, 'null']}
        issuer: {type: [string, 'null']}
        issue_date: {type: [string, 'null'], format: date}
        level:
          oneOf:
            - {$ref: '#/components/schemas/CertificateLevel'}
            - {type: 'null'}
        type:
          oneOf:
            - {$ref: '#/components/schemas/CertificateType'}
            - {type: 'null'}
        skills:
          type: array
          maxItems: 8
          items: {type: string}
        certificate_id: {type: [string, 'null']}
        verify_url: {type: [string, 'null']}
        confidence: {type: [number, 'null'], minimum: 0, maximum: 1}
        reasons:
          type: array
          items:
            type: string
            enum: [duplicate_file, duplicate_image, duplicate_certificate_id, not_a_certificate, injection_text,
                   tamper_signal, name_mismatch, unknown_issuer, date_invalid, incomplete, extraction_failed,
                   manual_entry, interrupted]
        source: {type: [string, 'null'], enum: [llm, cache, manual, null]}
        review_reason: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ManualCertificate:
      type: object
      additionalProperties: false
      required: [holder_name, title, issuer, issue_date, level, type, skills]
      properties:
        holder_name: {type: string, minLength: 1, maxLength: 200}
        title: {type: string, minLength: 1, maxLength: 200}
        issuer: {type: string, minLength: 1, maxLength: 200}
        issue_date: {type: string, format: date}
        level: {$ref: '#/components/schemas/CertificateLevel'}
        type: {$ref: '#/components/schemas/CertificateType'}
        skills:
          type: array
          minItems: 1
          maxItems: 8
          items: {type: string, minLength: 1, maxLength: 40}
    ReviewItem:
      type: object
      required: [certificate, student]
      properties:
        certificate: {$ref: '#/components/schemas/Certificate'}
        student:
          type: object
          required: [user_id, name, roll_no]
          properties:
            user_id: {type: string}
            name: {type: string}
            roll_no: {type: string}
        duplicate_of: {type: [string, 'null'], description: Reviewer-only id of the matching certificate}
    ReviewDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {type: string, enum: [approve, reject]}
        reason: {type: string, minLength: 3, maxLength: 300, description: Required when decision is reject}

    OpeningSummary:
      type: object
      required: [id, title, faculty, required_skills, status]
      properties:
        id: {type: string}
        title: {type: string}
        faculty: {$ref: '#/components/schemas/UserRef'}
        required_skills:
          type: array
          items: {type: string}
        status: {type: string, enum: [open, closed]}
        my_fit:
          oneOf:
            - type: object
              required: [score, verdict]
              properties:
                score: {type: number}
                verdict: {type: string, enum: [ready, close, not_yet]}
            - {type: 'null'}
        my_application_status: {type: [string, 'null'], enum: [pending, shortlisted, accepted, rejected, completed, null]}
    Opening:
      type: object
      required: [id, title, description, faculty, required_skills, status, created_at]
      properties:
        id: {type: string}
        title: {type: string}
        description: {type: string}
        faculty: {$ref: '#/components/schemas/UserRef'}
        required_skills:
          type: array
          items: {type: string}
        status: {type: string, enum: [open, closed]}
        created_at: {type: string, format: date-time}
        applicant_count: {type: [integer, 'null'], description: Owner only}
        preferred_skills:
          type: array
          maxItems: 10
          items: {type: string, minLength: 1, maxLength: 40}
        positions: {type: integer, minimum: 1}
        deadline: {type: [string, 'null'], format: date}
        eligible_years:
          type: array
          maxItems: 5
          items: {type: integer, minimum: 1, maximum: 5}
        min_cgpa: {type: [number, 'null']}
        allowed_departments:
          type: array
          maxItems: 5
          items: {type: string, maxLength: 10}
        eligibility_mode: {$ref: '#/components/schemas/EligibilityMode'}
        mode: {$ref: '#/components/schemas/WorkMode'}
        duration_weeks: {type: [integer, 'null'], minimum: 1, maximum: 52}
        hours_per_week: {type: [integer, 'null'], minimum: 1, maximum: 40}
        positions_left: {type: integer}
    OpeningCreate:
      type: object
      additionalProperties: false
      required: [title, description, required_skills]
      properties:
        title: {type: string, minLength: 5, maxLength: 120}
        description: {type: string, maxLength: 2000}
        required_skills:
          type: array
          minItems: 1
          maxItems: 10
          items: {type: string, minLength: 1, maxLength: 40}
        preferred_skills:
          type: array
          maxItems: 10
          items: {type: string, minLength: 1, maxLength: 40}
        positions: {type: integer, minimum: 1, maximum: 20}
        deadline: {type: [string, 'null'], format: date}
        eligible_years:
          type: array
          maxItems: 5
          items: {type: integer, minimum: 1, maximum: 5}
        min_cgpa: {type: [number, 'null'], minimum: 0, maximum: 10}
        allowed_departments:
          type: array
          maxItems: 5
          items: {type: string, maxLength: 10}
        eligibility_mode: {$ref: '#/components/schemas/EligibilityMode'}
        mode: {$ref: '#/components/schemas/WorkMode'}
        duration_weeks: {type: [integer, 'null'], minimum: 1, maximum: 52}
        hours_per_week: {type: [integer, 'null'], minimum: 1, maximum: 40}
    FitChip:
      type: object
      required: [concept, kind, trust_level]
      properties:
        concept: {type: string}
        kind: {type: string, enum: [matched, claimed_only, near, missing]}
        trust_level: {type: [integer, 'null'], enum: [0, 1, 2, null]}
        via: {type: [string, 'null']}
        similarity: {type: [number, 'null']}
        source:
          oneOf:
            - type: object
              required: [evidence_id, title]
              properties:
                evidence_id: {type: string}
                title: {type: string}
            - {type: 'null'}
    Fit:
      type: object
      required: [opening_id, student_id, score, components, weights, verdict, verdict_text, chips, gains]
      properties:
        opening_id: {type: string}
        student_id: {type: string}
        score: {type: number, minimum: 0, maximum: 100}
        components:
          type: object
          required: [semantic, skill, concept]
          properties:
            semantic: {type: number}
            skill: {type: number}
            concept: {type: number}
        weights:
          type: object
          required: [semantic, skill, concept]
          properties:
            semantic: {type: number}
            skill: {type: number}
            concept: {type: number}
        verdict: {type: string, enum: [ready, close, not_yet]}
        verdict_text: {type: string}
        chips:
          type: array
          items: {$ref: '#/components/schemas/FitChip'}
        gains:
          type: array
          items:
            type: object
            required: [concept, score_if_certified]
            properties:
              concept: {type: string}
              score_if_certified: {type: number}
        note: {type: [string, 'null']}
    Candidate:
      type: object
      required: [application, student, fit]
      properties:
        application: {$ref: '#/components/schemas/Application'}
        student:
          type: object
          required: [user_id, name, roll_no, year]
          properties:
            user_id: {type: string}
            name: {type: string}
            roll_no: {type: string}
            year: {type: integer}
        fit: {$ref: '#/components/schemas/Fit'}
    ApplicationStatus:
      type: string
      enum: [pending, shortlisted, accepted, rejected, completed]
    Application:
      type: object
      required: [id, opening_id, opening_title, student_id, status, applied_at, updated_at, history]
      properties:
        id: {type: string}
        opening_id: {type: string}
        opening_title: {type: string}
        student_id: {type: string}
        status: {$ref: '#/components/schemas/ApplicationStatus'}
        applied_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        history:
          type: array
          items: {$ref: '#/components/schemas/StatusEvent'}
    ApplicationPatch:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [shortlisted, accepted, rejected, completed]}
    WhyGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [id, label, kind]
            properties:
              id: {type: string}
              label: {type: string}
              kind: {type: string, enum: [student, concept, opening]}
        edges:
          type: array
          items:
            type: object
            required: [source, target, kind]
            properties:
              source: {type: string}
              target: {type: string}
              kind: {type: string, enum: [HAS_SKILL, SIMILAR_TO, REQUIRES]}
              score: {type: [number, 'null']}
    SkillGap:
      type: object
      required: [concept, openings_unlocked, total_gain]
      properties:
        concept: {type: string}
        openings_unlocked: {type: integer}
        total_gain: {type: number}

    AllotmentView:
      type: object
      required: [mentors, unallotted]
      properties:
        mentors:
          type: array
          items:
            type: object
            required: [mentor_id, name, mentee_count, overloaded]
            properties:
              mentor_id: {type: string}
              name: {type: string}
              mentee_count: {type: integer}
              overloaded: {type: boolean}
        unallotted:
          type: array
          items:
            type: object
            required: [user_id, name, roll_no, year]
            properties:
              user_id: {type: string}
              name: {type: string}
              roll_no: {type: string}
              year: {type: integer}
              suggested_mentor:
                type: [object, 'null']
                description: Assistive only; the HOD decides. Mentors under the load limit, ordered by topic overlap.
                properties:
                  mentor_id: {type: string}
                  name: {type: string}
                  reason: {type: string}
    AllotmentRequest:
      type: object
      additionalProperties: false
      required: [mentor_id, student_ids]
      properties:
        mentor_id: {type: string}
        student_ids:
          type: array
          minItems: 1
          maxItems: 30
          items: {type: string}

    AttentionReason:
      type: string
      enum: [no_recent_session, no_meeting_this_term, overdue_action, stale_issue, marked_at_risk, suggested_at_risk]
    MenteeRow:
      type: object
      required: [student_id, name, roll_no, mentorship_type, meetings_this_term, meetings_required, open_actions,
                 overdue_actions, open_issues, unconfirmed_sessions, needs_attention, attention_reasons]
      properties:
        student_id: {type: string}
        name: {type: string}
        roll_no: {type: string}
        mentorship_type: {type: string, enum: [assigned, guide]}
        meetings_this_term: {type: integer}
        meetings_required: {type: integer}
        last_session_date: {type: [string, 'null'], format: date}
        open_actions: {type: integer}
        overdue_actions: {type: integer}
        open_issues: {type: integer}
        unconfirmed_sessions: {type: integer}
        needs_attention: {type: boolean}
        attention_reasons:
          type: array
          items: {$ref: '#/components/schemas/AttentionReason'}
        attention_details:
          type: object
          description: Optional human detail per reason, e.g. {"suggested_at_risk":"attendance 68%"} (P2 REQ-029)
          additionalProperties: {type: string}
    AcademicRecord:
      type: object
      required: [term_id, cgpa, attendance_pct, backlogs]
      description: '[MOCK] seeded academic snapshot'
      properties:
        term_id: {type: string}
        cgpa: {type: number, minimum: 0, maximum: 10}
        attendance_pct: {type: number, minimum: 0, maximum: 100}
        backlogs: {type: integer, minimum: 0}
    Mentorship:
      type: object
      required: [id, type, status, since, mentor]
      properties:
        id: {type: string}
        type: {type: string, enum: [assigned, guide]}
        status: {type: string, enum: [active, ended]}
        since: {type: string, format: date}
        until: {type: [string, 'null'], format: date}
        end_reason: {type: [string, 'null'], enum: [handover, graduated, completed, null]}
        mentor: {$ref: '#/components/schemas/UserRef'}
        opening_id: {type: [string, 'null']}
        opening_title: {type: [string, 'null']}
    SessionSummary:
      type: object
      required: [id, date, mode, kind, context, topics, logged_by]
      properties:
        id: {type: string}
        date: {type: string, format: date}
        mode: {type: string, enum: [in_person, online]}
        kind: {type: string, enum: [individual, group]}
        context: {type: string, enum: [assigned, guide]}
        topics:
          type: array
          items: {$ref: '#/components/schemas/TopicCategory'}
        logged_by: {$ref: '#/components/schemas/UserRef'}
        present: {type: [boolean, 'null'], description: For the student in context}
        confirmed_at: {type: [string, 'null'], format: date-time}
        notes: {type: [string, 'null'], description: Present only when the caller is the author}
        confidential: {type: boolean}
    ActionItem:
      type: object
      required: [id, student_id, text, owner, due_date, status, overdue, session_id, created_at, updated_at]
      properties:
        id: {type: string}
        student_id: {type: string}
        text: {type: string, maxLength: 300}
        owner: {type: string, enum: [mentee, mentor]}
        due_date: {type: string, format: date}
        status: {type: string, enum: [open, done, verified, dropped]}
        overdue: {type: boolean}
        session_id: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        history:
          type: array
          items: {$ref: '#/components/schemas/StatusEvent'}
    ActionItemPatch:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [open, done, verified, dropped]}
    Issue:
      type: object
      required: [id, student_id, category, status, escalated, confidential, raised_by_role, raised_at]
      properties:
        id: {type: string}
        student_id: {type: string}
        category: {$ref: '#/components/schemas/TopicCategory'}
        text: {type: [string, 'null'], description: Omitted when the caller may not read it (security §4)}
        status: {type: string, enum: [raised, acknowledged, in_progress, resolved]}
        escalated: {type: boolean}
        confidential: {type: boolean}
        raised_by_role: {type: string, enum: [faculty, student]}
        raised_at: {type: string, format: date-time}
        resolved_at: {type: [string, 'null'], format: date-time}
        resolution: {type: [string, 'null']}
        history:
          type: array
          items: {$ref: '#/components/schemas/StatusEvent'}
    IssueCreate:
      type: object
      additionalProperties: false
      required: [student_id, category, text]
      properties:
        student_id: {type: string}
        category: {$ref: '#/components/schemas/TopicCategory'}
        text: {type: string, minLength: 1, maxLength: 1000}
        session_id: {type: [string, 'null']}
        confidential: {type: boolean, default: false}
    IssuePatch:
      type: object
      additionalProperties: false
      properties:
        status: {type: string, enum: [acknowledged, in_progress, resolved]}
        resolution: {type: string, minLength: 1, maxLength: 1000}
        escalated: {type: boolean, const: true}
        confidential: {type: boolean}
    MenteeOverview:
      type: object
      required: [student, mentorships, academics, sessions, action_items, issues, applications, certificates]
      properties:
        student: {$ref: '#/components/schemas/StudentProfile'}
        mentorships:
          type: array
          items: {$ref: '#/components/schemas/Mentorship'}
        academics:
          type: array
          items: {$ref: '#/components/schemas/AcademicRecord'}
        sessions:
          type: array
          items: {$ref: '#/components/schemas/SessionSummary'}
        action_items:
          type: array
          items: {$ref: '#/components/schemas/ActionItem'}
        issues:
          type: array
          items: {$ref: '#/components/schemas/Issue'}
        applications:
          type: array
          items: {$ref: '#/components/schemas/Application'}
        certificates:
          type: array
          items: {$ref: '#/components/schemas/Certificate'}
        attention_reasons:
          type: array
          items: {$ref: '#/components/schemas/AttentionReason'}
        attention_details:
          type: object
          description: Same as MenteeRow.attention_details, for the caller's own mentee row (P2 REQ-029)
          additionalProperties: {type: string}
        term_summary:
          description: P2 REQ-032
          oneOf:
            - type: object
              required: [sessions_attended, actions_done, actions_total, issues_raised, issues_resolved, certificates_certified]
              properties:
                sessions_attended: {type: integer}
                actions_done: {type: integer}
                actions_total: {type: integer}
                issues_raised: {type: integer}
                issues_resolved: {type: integer}
                certificates_certified: {type: integer}
            - {type: 'null'}
        learner_level: {type: [string, 'null'], enum: [slow, average, advanced, null]}
        learner_note: {type: [string, 'null']}
        marked_at_risk: {type: [boolean, 'null']}
    MenteePatch:
      type: object
      additionalProperties: false
      properties:
        learner_level: {type: [string, 'null'], enum: [slow, average, advanced, null]}
        learner_note: {type: [string, 'null'], maxLength: 500}
        marked_at_risk: {type: boolean}

    SessionCreate:
      type: object
      additionalProperties: false
      required: [date, mode, kind, context, attendees, topics]
      properties:
        date: {type: string, format: date}
        mode: {type: string, enum: [in_person, online]}
        kind: {type: string, enum: [individual, group]}
        context: {type: string, enum: [assigned, guide]}
        opening_id: {type: [string, 'null']}
        attendees:
          type: array
          minItems: 1
          maxItems: 40
          items:
            type: object
            additionalProperties: false
            required: [student_id, present]
            properties:
              student_id: {type: string}
              present: {type: boolean}
        topics:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items: {$ref: '#/components/schemas/TopicCategory'}
        notes: {type: [string, 'null'], maxLength: 4000}
        confidential: {type: boolean, default: false}
        next_followup: {type: [string, 'null'], format: date}
        action_items:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [student_id, text, owner, due_date]
            properties:
              student_id: {type: string}
              text: {type: string, minLength: 1, maxLength: 300}
              owner: {type: string, enum: [mentee, mentor]}
              due_date: {type: string, format: date}
        issues:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [student_id, category, text]
            properties:
              student_id: {type: string}
              category: {$ref: '#/components/schemas/TopicCategory'}
              text: {type: string, minLength: 1, maxLength: 1000}
              confidential: {type: boolean, default: false}
    SessionDetail:
      type: object
      required: [id, date, mode, kind, context, topics, confidential, logged_by, attendees, action_items, issues, created_at]
      properties:
        id: {type: string}
        date: {type: string, format: date}
        mode: {type: string, enum: [in_person, online]}
        kind: {type: string, enum: [individual, group]}
        context: {type: string, enum: [assigned, guide]}
        opening_id: {type: [string, 'null']}
        topics:
          type: array
          items: {$ref: '#/components/schemas/TopicCategory'}
        notes: {type: [string, 'null'], description: Only present for the author (REQ-015)}
        confidential: {type: boolean}
        next_followup: {type: [string, 'null'], format: date}
        logged_by: {$ref: '#/components/schemas/UserRef'}
        attendees:
          type: array
          description: Students receive only their own row
          items:
            type: object
            required: [student_id, name, present]
            properties:
              student_id: {type: string}
              name: {type: string}
              present: {type: boolean}
              confirmed_at: {type: [string, 'null'], format: date-time}
              feedback: {type: [string, 'null'], description: 'helpful or not_helpful. Author only (P2, REQ-034); omitted for everyone else'}
              feedback_comment: {type: [string, 'null'], maxLength: 300, description: 'Author only (P2, REQ-034)'}
        action_items:
          type: array
          items: {$ref: '#/components/schemas/ActionItem'}
        issues:
          type: array
          items: {$ref: '#/components/schemas/Issue'}
        created_at: {type: string, format: date-time}
    MyMentorship:
      type: object
      required: [assigned_mentor, guides, sessions_to_confirm, recent_sessions, action_items, issues, applications]
      properties:
        assigned_mentor:
          oneOf:
            - type: object
              required: [user_id, name, designation, email]
              properties:
                user_id: {type: string}
                name: {type: string}
                designation: {type: string}
                email: {type: string}
            - {type: 'null'}
        guides:
          type: array
          items: {$ref: '#/components/schemas/Mentorship'}
        next_followup: {type: [string, 'null'], format: date}
        sessions_to_confirm:
          type: array
          items: {$ref: '#/components/schemas/SessionSummary'}
        recent_sessions:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/SessionSummary'}
        action_items:
          type: array
          items: {$ref: '#/components/schemas/ActionItem'}
        issues:
          type: array
          items: {$ref: '#/components/schemas/Issue'}
        applications:
          type: array
          items: {$ref: '#/components/schemas/Application'}
    Feedback:
      type: object
      additionalProperties: false
      required: [feedback]
      properties:
        feedback: {type: string, enum: [helpful, not_helpful]}
        comment: {type: [string, 'null'], maxLength: 300}
    MeetingRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: {type: string, minLength: 1, maxLength: 300}
    Endorsement:
      type: object
      additionalProperties: false
      required: [concept]
      properties:
        concept: {type: string, minLength: 1, maxLength: 40}
    TrackRecord:
      type: object
      required: [faculty_id, name, openings_posted, guide_links_accepted, guide_links_completed]
      properties:
        faculty_id: {type: string}
        name: {type: string}
        openings_posted: {type: integer}
        guide_links_accepted: {type: integer}
        guide_links_completed: {type: integer}
        median_days_to_first_decision: {type: [number, 'null']}

    Dashboard:
      type: object
      required: [term, students_total, students_allotted, unallotted, ratio, compliance_pct, overdue_actions,
                 pending_reviews, mentors, issues_by_category, achievements_by_type]
      properties:
        term:
          type: object
          required: [id, name]
          properties:
            id: {type: string}
            name: {type: string}
        students_total: {type: integer}
        students_allotted: {type: integer}
        unallotted: {type: integer}
        ratio: {type: string, examples: ['1:12']}
        compliance_pct: {type: number}
        overdue_actions: {type: integer}
        pending_reviews: {type: integer}
        needs_attention_count: {type: integer}
        mentors:
          type: array
          items:
            type: object
            required: [mentor_id, name, mentee_count, overloaded, meetings_held, mentees_compliant, compliance_pct,
                       issues_raised, issues_resolved, overdue_actions]
            properties:
              mentor_id: {type: string}
              name: {type: string}
              mentee_count: {type: integer}
              overloaded: {type: boolean}
              meetings_held: {type: integer}
              mentees_compliant: {type: integer}
              compliance_pct: {type: number}
              issues_raised: {type: integer}
              issues_resolved: {type: integer}
              overdue_actions: {type: integer}
        issues_by_category:
          type: array
          items:
            type: object
            required: [category, raised, resolved]
            properties:
              category: {type: string, description: TopicCategory value or "confidential"}
              raised: {type: integer}
              resolved: {type: integer}
        achievements_by_type:
          type: array
          items:
            type: object
            required: [type, count]
            properties:
              type: {type: string}
              count: {type: integer}
        escalated_issues:
          description: HOD only (P1 REQ-022). Unresolved escalated, non-confidential issues of the department, oldest first.
          type: array
          items:
            type: object
            required: [issue_id, student_id, student_name, mentor_name, category, text, status, raised_at]
            properties:
              issue_id: {type: string}
              student_id: {type: string}
              student_name: {type: string}
              mentor_name: {type: string}
              category: {$ref: '#/components/schemas/TopicCategory'}
              text: {type: string}
              status: {type: string, enum: [raised, acknowledged, in_progress]}
              raised_at: {type: string, format: date-time}
        needs_attention_list:
          description: HOD only
          type: array
          items:
            type: object
            required: [student_id, name, mentor_name, reasons]
            properties:
              student_id: {type: string}
              name: {type: string}
              mentor_name: {type: string}
              reasons:
                type: array
                items: {$ref: '#/components/schemas/AttentionReason'}
    MetricRecords:
      type: object
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            description: Metric-specific row (backend §7); student labels are pseudonyms for IQAC
        next_cursor: {type: [string, 'null']}
        total: {type: integer, description: Equals the dashboard number}

    Notification:
      type: object
      required: [id, type, title, link, read, created_at]
      properties:
        id: {type: string}
        type:
          type: string
          enum: [application_received, application_status, certificate_result, review_needed, allotted, session_logged,
                 action_assigned, issue_escalated, issue_raised_by_mentee, meeting_request]
        title: {type: string, maxLength: 120}
        body: {type: [string, 'null'], maxLength: 200}
        link: {type: string}
        read: {type: boolean}
        created_at: {type: string, format: date-time}
    NotificationPage:
      type: object
      required: [items, next_cursor, unread]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Notification'}
        next_cursor: {type: [string, 'null']}
        unread: {type: integer}
    Reminder:
      type: object
      required: [kind, ref_id, message]
      properties:
        kind: {type: string, enum: [meetings_due, action_overdue, issue_stale, session_unconfirmed]}
        student_id: {type: [string, 'null']}
        student_name: {type: [string, 'null']}
        ref_id: {type: string}
        due_date: {type: [string, 'null'], format: date}
        message: {type: string}
    Health:
      type: object
      required: [status, neo4j, llm_provider]
      properties:
        status: {type: string, enum: [ok]}
        neo4j: {type: string, enum: [up, down]}
        llm_provider: {type: string, enum: [groq, anthropic, none]}

    # ---- Profiles and matching v2 (additive; docs/plan/profiles-and-matching-plan.md) ----
    Programme:
      type: string
      enum: [btech, mtech, phd, other]
    SkillLevel:
      type: string
      enum: [beginner, intermediate, advanced]
    EligibilityMode:
      type: string
      enum: [advisory, strict]
    WorkMode:
      type: string
      enum: [on_campus, remote, hybrid]
    ProjectInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 100}
        description: {type: [string, 'null'], maxLength: 300}
        link: {type: [string, 'null'], maxLength: 200, description: 'https URL only'}
        skills:
          type: array
          maxItems: 8
          items: {type: string, minLength: 1, maxLength: 40}
    Project:
      type: object
      required: [id, title, skills]
      properties:
        id: {type: string}
        title: {type: string}
        description: {type: [string, 'null']}
        link: {type: [string, 'null']}
        skills:
          type: array
          items: {type: string}
    CgpaView:
      type: object
      required: [source]
      properties:
        record: {type: [number, 'null'], description: 'Institutional record [MOCK]; read-only'}
        record_term: {type: [string, 'null']}
        self_reported: {type: [number, 'null']}
        effective: {type: [number, 'null'], description: 'The record when it exists, else the self-reported value'}
        source: {type: string, enum: [record, self_reported, unknown]}
    MySkill:
      type: object
      required: [concept, trust_level, claimed, sources]
      properties:
        concept: {type: string}
        trust_level: {type: integer, minimum: 0, maximum: 2, description: 'From certificates and endorsements only, never from the student'}
        claimed: {type: boolean}
        level: {$ref: '#/components/schemas/SkillLevel'}
        sources:
          type: array
          items:
            type: object
            required: [evidence_id, title]
            properties:
              evidence_id: {type: string}
              title: {type: string}
        endorsed_by:
          type: array
          description: Display names of the faculty who endorsed this skill (trust level 2)
          items: {type: string}
    CompletenessItem:
      type: object
      required: [key, label, done]
      properties:
        key: {type: string}
        label: {type: string}
        done: {type: boolean}
    Completeness:
      type: object
      required: [percent, items]
      properties:
        percent: {type: integer, minimum: 0, maximum: 100}
        items:
          type: array
          items: {$ref: '#/components/schemas/CompletenessItem'}
        next_action: {type: [string, 'null']}
    ResumeInfo:
      type: object
      required: [id, uploaded_at, size_bytes, pages, status]
      properties:
        id: {type: string}
        uploaded_at: {type: string, format: date-time}
        size_bytes: {type: integer}
        pages: {type: integer}
        status: {type: string, enum: [current, superseded]}
    MyProfile:
      type: object
      required: [user_id, name, roll_no, dept_code, year, interests, links, preferences, cgpa, skills, projects, completeness, open_to_opportunities]
      properties:
        user_id: {type: string}
        name: {type: string}
        roll_no: {type: string}
        dept_code: {type: string, description: Read-only; the institution controls it}
        programme: {$ref: '#/components/schemas/Programme'}
        year: {type: integer, minimum: 1, maximum: 5}
        headline: {type: [string, 'null']}
        bio: {type: [string, 'null']}
        interests:
          type: array
          items: {type: string}
        links:
          type: array
          items: {type: string}
        availability_hours: {type: [integer, 'null']}
        available_from: {type: [string, 'null'], format: date}
        preferences:
          type: array
          items: {type: string}
        open_to_opportunities: {type: boolean}
        cgpa: {$ref: '#/components/schemas/CgpaView'}
        skills:
          type: array
          items: {$ref: '#/components/schemas/MySkill'}
        projects:
          type: array
          items: {$ref: '#/components/schemas/Project'}
        resume:
          oneOf:
            - {$ref: '#/components/schemas/ResumeInfo'}
            - {type: 'null'}
        certificates_certified: {type: integer}
        completeness: {$ref: '#/components/schemas/Completeness'}
    ConceptSuggestion:
      type: object
      required: [name]
      properties:
        name: {type: string}
        matched_alias: {type: [string, 'null']}
    EligibilityCheck:
      type: object
      required: [rule, status, detail]
      properties:
        rule: {type: string, enum: [open, deadline, capacity, year, department, min_cgpa, not_a_repeat, guide_capacity]}
        status: {type: string, enum: [ok, failed, unknown]}
        detail: {type: string}
    Eligibility:
      type: object
      required: [eligible, mode, checks]
      properties:
        eligible: {type: boolean, description: 'False when any check failed. Unknown checks do not fail it.'}
        mode: {$ref: '#/components/schemas/EligibilityMode'}
        checks:
          type: array
          items: {$ref: '#/components/schemas/EligibilityCheck'}
    RecommendedOpening:
      type: object
      required: [id, title, faculty, required_skills, status, my_fit, eligibility, reasons, positions, positions_left]
      properties:
        id: {type: string}
        title: {type: string}
        faculty: {$ref: '#/components/schemas/UserRef'}
        required_skills:
          type: array
          items: {type: string}
        preferred_skills:
          type: array
          items: {type: string}
        status: {type: string, enum: [open, closed]}
        my_fit:
          type: object
          required: [score, verdict]
          properties:
            score: {type: number}
            verdict: {type: string, enum: [ready, close, not_yet]}
        my_application_status:
          type: [string, 'null']
        eligibility: {$ref: '#/components/schemas/Eligibility'}
        reasons:
          type: array
          description: One-line explanations built from the fit chips (templates, no model)
          items: {type: string}
        positions: {type: integer}
        positions_left: {type: integer}
        deadline: {type: [string, 'null'], format: date}
        eligible_years:
          type: array
          items: {type: integer}
        min_cgpa: {type: [number, 'null']}
        mode: {$ref: '#/components/schemas/WorkMode'}
        duration_weeks: {type: [integer, 'null']}
        hours_per_week: {type: [integer, 'null']}
    RecommendationGroup:
      type: object
      required: [key, label, items]
      properties:
        key: {type: string, enum: [best, worth, stretch, ineligible]}
        label: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/RecommendedOpening'}
    Recommendations:
      type: object
      required: [cold_start, completeness_percent, groups]
      properties:
        cold_start: {type: boolean, description: 'Fewer than two skills: ranked by interests and department'}
        completeness_percent: {type: integer}
        groups:
          type: array
          items: {$ref: '#/components/schemas/RecommendationGroup'}
    OpeningPatch:
      type: object
      additionalProperties: false
      properties:
        title: {type: string, minLength: 5, maxLength: 120}
        description: {type: string, maxLength: 2000}
        required_skills:
          type: array
          minItems: 1
          maxItems: 10
          items: {type: string, minLength: 1, maxLength: 40}
        preferred_skills:
          type: array
          maxItems: 10
          items: {type: string, minLength: 1, maxLength: 40}
        positions: {type: integer, minimum: 1, maximum: 20}
        deadline: {type: [string, 'null'], format: date}
        eligible_years:
          type: array
          maxItems: 5
          items: {type: integer, minimum: 1, maximum: 5}
        min_cgpa: {type: [number, 'null'], minimum: 0, maximum: 10}
        allowed_departments:
          type: array
          maxItems: 5
          items: {type: string, maxLength: 10}
        eligibility_mode: {$ref: '#/components/schemas/EligibilityMode'}
        mode: {$ref: '#/components/schemas/WorkMode'}
        duration_weeks: {type: [integer, 'null'], minimum: 1, maximum: 52}
        hours_per_week: {type: [integer, 'null'], minimum: 1, maximum: 40}
        status: {type: string, enum: [open, closed]}
    FacultyResearchArea:
      type: object
      additionalProperties: false
      required: [concept]
      properties:
        concept: {type: string, minLength: 1, maxLength: 40}
        primary: {type: boolean}
    FacultyCourse:
      type: object
      additionalProperties: false
      required: [code, title]
      properties:
        code: {type: string, minLength: 1, maxLength: 20}
        title: {type: string, minLength: 1, maxLength: 100}
        term_id: {type: [string, 'null'], maxLength: 20}
        topics:
          type: array
          maxItems: 8
          items: {type: string, minLength: 1, maxLength: 40}
    FacultyQualification:
      type: object
      additionalProperties: false
      required: [degree, institution]
      properties:
        degree: {type: string, minLength: 1, maxLength: 60}
        institution: {type: string, minLength: 1, maxLength: 100}
        year: {type: [integer, 'null'], minimum: 1950, maximum: 2100}
    FacultyProfilePatch:
      type: object
      additionalProperties: false
      properties:
        research_areas:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/FacultyResearchArea'}
        expertise:
          type: array
          maxItems: 15
          items: {type: string, minLength: 1, maxLength: 40}
        courses:
          type: array
          maxItems: 15
          items: {$ref: '#/components/schemas/FacultyCourse'}
        qualifications:
          type: array
          maxItems: 5
          items: {$ref: '#/components/schemas/FacultyQualification'}
        publications:
          type: array
          maxItems: 10
          items: {type: string, minLength: 1, maxLength: 200}
        max_guided_students: {type: integer, minimum: 0, maximum: 50}
        accepting_guides: {type: boolean}
        office_hours: {type: [string, 'null'], maxLength: 200}
        links:
          type: array
          maxItems: 5
          items: {type: string, maxLength: 200}
    FacultyProfile:
      type: object
      required: [user_id, name, designation, dept_code, research_areas, expertise, courses, qualifications, publications, accepting_guides, links]
      properties:
        user_id: {type: string}
        name: {type: string}
        designation: {type: string}
        dept_code: {type: string}
        employee_id: {type: [string, 'null']}
        research_areas:
          type: array
          items: {$ref: '#/components/schemas/FacultyResearchArea'}
        expertise:
          type: array
          items: {type: string}
        courses:
          type: array
          items: {$ref: '#/components/schemas/FacultyCourse'}
        qualifications:
          type: array
          items: {$ref: '#/components/schemas/FacultyQualification'}
        publications:
          type: array
          items: {type: string}
        max_guided_students: {type: [integer, 'null']}
        guided_students: {type: integer, description: Active guide links}
        accepting_guides: {type: boolean}
        office_hours: {type: [string, 'null']}
        links:
          type: array
          items: {type: string}
    FacultyPublic:
      type: object
      required: [profile, track_record]
      properties:
        profile: {$ref: '#/components/schemas/FacultyProfile'}
        track_record: {$ref: '#/components/schemas/TrackRecord'}
        open_openings:
          type: array
          items:
            type: object
            required: [id, title]
            properties:
              id: {type: string}
              title: {type: string}
    FacultyCard:
      type: object
      required: [user_id, name, designation, research_areas, shared_topics, open_openings, accepting_guides]
      properties:
        user_id: {type: string}
        name: {type: string}
        designation: {type: string}
        research_areas:
          type: array
          items: {type: string}
        shared_topics:
          type: array
          description: Topics this faculty member shares with the calling student; the list is ordered by overlap and carries no score
          items: {type: string}
        open_openings: {type: integer}
        accepting_guides: {type: boolean}
        guided_students: {type: integer}
        max_guided_students: {type: [integer, 'null']}
    ResumeSuggestions:
      type: object
      required: [skills, note]
      properties:
        skills:
          type: array
          items:
            type: object
            required: [concept, already_claimed]
            properties:
              concept: {type: string}
              already_claimed: {type: boolean}
        note: {type: string}

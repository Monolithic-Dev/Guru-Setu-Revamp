openapi: 3.1.0
info:
  title: GuruSetu API
  version: 1.0.0
  contact:
    name: GuruSetu Genesis team (P2 owns this contract)
  description: >
    Contract for CMP-02. Behaviour, rules and IDs are in docs/04-backend/backend.md.
    Each operation carries x-id (API-nnn), x-req and x-tier. Errors are application/problem+json (backend.md §3.1).
servers:
  - url: http://localhost:8000/api/v1
security:
  - bearer: []
tags:
  - name: auth
  - name: students
  - name: certificates
  - name: openings
  - name: applications
  - name: mentorship
  - name: tracking
  - name: department
  - name: notifications
  - name: ops

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      x-id: API-001
      x-req: [REQ-031]
      x-tier: P0
      summary: Exchange email and password for a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
            example: {email: aarav@demo.gurusetu, password: Demo@123}
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /me:
    get:
      tags: [auth]
      operationId: getMe
      x-id: API-002
      x-req: [REQ-031]
      x-tier: P0
      summary: Current user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Unauthenticated'}

  /students/{student_id}:
    get:
      tags: [students]
      operationId: getStudent
      x-id: API-003
      x-req: [REQ-003, REQ-005]
      x-tier: P0
      summary: Student profile with trust-marked skills (scope per security §4)
      parameters: [{$ref: '#/components/parameters/StudentId'}]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StudentProfile'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}

  /me/profile:
    get:
      tags: [students]
      operationId: getMyProfile
      x-id: API-048
      x-req: [REQ-004]
      x-tier: P1
      summary: Own profile with completeness, per-field trust labels, projects and resume info
      responses:
        '200':
          description: Own profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MyProfile'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    patch:
      tags: [students]
      operationId: patchMyProfile
      x-id: API-004
      x-req: [REQ-004]
      x-tier: P0
      summary: Partial update of own student profile (omitted fields untouched)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfilePatch'}
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StudentProfile'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /certificates:
    post:
      tags: [certificates]
      operationId: uploadCertificate
      x-id: API-005
      x-req: [REQ-001]
      x-tier: P0
      summary: Upload a certificate; processing continues in JOB-01
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG or PDF (magic bytes), at most MAX_UPLOAD_MB
      responses:
        '202':
          description: Accepted; poll API-006
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Certificate'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /certificates/{id}:
    get:
      tags: [certificates]
      operationId: getCertificate
      x-id: API-006
      x-req: [REQ-001]
      x-tier: P0
      summary: Poll one certificate
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200':
          description: Certificate
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Certificate'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}

  /me/certificates:
    get:
      tags: [certificates]
      operationId: listMyCertificates
      x-id: API-007
      x-req: [REQ-001]
      x-tier: P0
      summary: Own certificates, newest first (max 100)
      responses:
        '200':
          description: Certificates
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: {$ref: '#/components/schemas/Certificate'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /certificates/{id}/manual:
    put:
      tags: [certificates]
      operationId: putManualCertificate
      x-id: API-008
      x-req: [REQ-037]
      x-tier: P0
      summary: Manual fields for a failed certificate; moves it to needs_review
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManualCertificate'}
      responses:
        '200':
          description: Certificate in needs_review
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Certificate'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /reviews/certificates:
    get:
      tags: [certificates]
      operationId: listReviewQueue
      x-id: API-009
      x-req: [REQ-002]
      x-tier: P0
      summary: needs_review certificates in the caller's scope (max 100)
      responses:
        '200':
          description: Queue, oldest first
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: {$ref: '#/components/schemas/ReviewItem'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /certificates/{id}/review:
    post:
      tags: [certificates]
      operationId: reviewCertificate
      x-id: API-010
      x-req: [REQ-002]
      x-tier: P0
      summary: Approve or reject a needs_review certificate
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewDecision'}
            example: {decision: reject, reason: Name on certificate differs from profile}
      responses:
        '200':
          description: Reviewed certificate
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Certificate'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /certificates/{id}/file:
    get:
      tags: [certificates]
      operationId: getCertificateFile
      x-id: API-011
      x-req: [REQ-002]
      x-tier: P0
      summary: Original file (Content-Disposition inline, X-Content-Type-Options nosniff)
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200':
          description: File bytes
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            application/pdf: {schema: {type: string, format: binary}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}

  /openings:
    get:
      tags: [openings]
      operationId: listOpenings
      x-id: API-012
      x-req: [REQ-004]
      x-tier: P0
      summary: Open openings; for students includes my_fit and my application status (max 50)
      responses:
        '200':
          description: Openings
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items: {$ref: '#/components/schemas/OpeningSummary'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    post:
      tags: [openings]
      operationId: createOpening
      x-id: API-014
      x-req: [REQ-030]
      x-tier: P1
      summary: Create an opening (faculty)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpeningCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Opening'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /openings/{id}:
    get:
      tags: [openings]
      operationId: getOpening
      x-id: API-013
      x-req: [REQ-004]
      x-tier: P0
      summary: Opening detail
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200':
          description: Opening
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Opening'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}

    patch:
      tags: [openings]
      operationId: patchOpening
      x-id: API-049
      x-req: [REQ-030]
      x-tier: P1
      summary: Edit an opening (owner only; omitted fields untouched; required skills are a full list)
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpeningPatch'}
      responses:
        '200':
          description: Updated opening
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Opening'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /openings/{id}/fit:
    get:
      tags: [openings]
      operationId: getFit
      x-id: API-015
      x-req: [REQ-004]
      x-tier: P0
      summary: Fit Check (ai-system §4); student_id only for the owning faculty viewing an applicant
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - name: student_id
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: Fit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Fit'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}

  /openings/{id}/candidates:
    get:
      tags: [openings]
      operationId: listCandidates
      x-id: API-016
      x-req: [REQ-005]
      x-tier: P0
      summary: Applicants ranked by fit (owner only)
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200':
          description: Ranked applicants
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: {$ref: '#/components/schemas/Candidate'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /openings/{id}/applications:
    post:
      tags: [applications]
      operationId: apply
      x-id: API-017
      x-req: [REQ-006]
      x-tier: P0
      summary: Apply to an open opening (student)
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '201':
          description: Application created (pending)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Application'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /openings/{id}/why:
    get:
      tags: [openings]
      operationId: getWhy
      x-id: API-020
      x-req: [REQ-020]
      x-tier: P1
      summary: Why-paths graph for the calling student
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200':
          description: Graph
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WhyGraph'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}

  /applications/{id}:
    patch:
      tags: [applications]
      operationId: patchApplication
      x-id: API-018
      x-req: [REQ-006]
      x-tier: P0
      summary: Move an application along the state machine (backend §6.3)
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApplicationPatch'}
            example: {status: shortlisted}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Application'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /me/applications:
    get:
      tags: [applications]
      operationId: listMyApplications
      x-id: API-019
      x-req: [REQ-006, REQ-014]
      x-tier: P0
      summary: Own applications with history (student)
      responses:
        '200':
          description: Applications
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: {$ref: '#/components/schemas/Application'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /me/skill-gaps:
    get:
      tags: [openings]
      operationId: listSkillGaps
      x-id: API-021
      x-req: [REQ-021]
      x-tier: P1
      summary: Top 5 skills that unlock the most openings
      responses:
        '200':
          description: Gaps
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items: {$ref: '#/components/schemas/SkillGap'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /dept/allotment:
    get:
      tags: [mentorship]
      operationId: getAllotment
      x-id: API-022
      x-req: [REQ-007]
      x-tier: P0
      summary: Mentor loads and unallotted students (HOD)
      responses:
        '200':
          description: Allotment view
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AllotmentView'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /allotments:
    post:
      tags: [mentorship]
      operationId: allot
      x-id: API-023
      x-req: [REQ-007, REQ-028]
      x-tier: P0
      summary: Assign students to a mentor; previous assigned links end with reason handover
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AllotmentRequest'}
      responses:
        '200':
          description: Updated allotment view
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AllotmentView'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /me/mentees:
    get:
      tags: [tracking]
      operationId: listMyMentees
      x-id: API-024
      x-req: [REQ-012, REQ-029]
      x-tier: P0
      summary: Mentor home rows with flags (backend §6.4)
      responses:
        '200':
          description: Rows, flagged first
          content:
            application/json:
              schema:
                type: array
                maxItems: 60
                items: {$ref: '#/components/schemas/MenteeRow'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /mentees/{student_id}/overview:
    get:
      tags: [tracking]
      operationId: getMenteeOverview
      x-id: API-025
      x-req: [REQ-013, REQ-032]
      x-tier: P0
      summary: Mentee 360
      parameters: [{$ref: '#/components/parameters/StudentId'}]
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MenteeOverview'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}

  /mentees/{student_id}:
    patch:
      tags: [mentorship]
      operationId: patchMentee
      x-id: API-043
      x-req: [REQ-029, REQ-033]
      x-tier: P2
      summary: Learner level, intervention note, at-risk mark (assigned mentor)
      parameters: [{$ref: '#/components/parameters/StudentId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MenteePatch'}
      responses:
        '200':
          description: Updated overview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MenteeOverview'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /sessions:
    post:
      tags: [mentorship]
      operationId: createSession
      x-id: API-026
      x-req: [REQ-008, REQ-010, REQ-011]
      x-tier: P0
      summary: Log a session with attendance, action items and issues in one transaction
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SessionCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionDetail'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /sessions/{id}:
    get:
      tags: [mentorship]
      operationId: getSession
      x-id: API-027
      x-req: [REQ-008, REQ-015]
      x-tier: P0
      summary: Session detail; notes only for the author; students see only their own attendee row
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionDetail'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}

  /sessions/{id}/confirm:
    post:
      tags: [mentorship]
      operationId: confirmSession
      x-id: API-028
      x-req: [REQ-009]
      x-tier: P0
      summary: Present attendee confirms attendance (idempotent)
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionDetail'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /sessions/{id}/feedback:
    post:
      tags: [mentorship]
      operationId: sessionFeedback
      x-id: API-042
      x-req: [REQ-034]
      x-tier: P2
      summary: Present attendee rates the session (replaces earlier feedback)
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Feedback'}
      responses:
        '200': {description: Saved}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /me/mentorship:
    get:
      tags: [tracking]
      operationId: getMyMentorship
      x-id: API-029
      x-req: [REQ-014]
      x-tier: P0
      summary: Student mentorship page
      responses:
        '200':
          description: Mentorship data
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MyMentorship'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /action-items/{id}:
    patch:
      tags: [tracking]
      operationId: patchActionItem
      x-id: API-030
      x-req: [REQ-010]
      x-tier: P0
      summary: Change action item status (backend §6.6)
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActionItemPatch'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActionItem'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /issues:
    post:
      tags: [tracking]
      operationId: createIssue
      x-id: API-031
      x-req: [REQ-011, REQ-024]
      x-tier: P0
      summary: Raise an issue (mentor for a mentee; student for self in P1)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IssueCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Issue'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /issues/{id}:
    patch:
      tags: [tracking]
      operationId: patchIssue
      x-id: API-032
      x-req: [REQ-011, REQ-022, REQ-036]
      x-tier: P0
      summary: Change issue status, resolution, escalation or confidentiality
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IssuePatch'}
            example: {status: resolved, resolution: Met parents; attendance plan agreed}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Issue'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /dept/dashboard:
    get:
      tags: [department]
      operationId: getDashboard
      x-id: API-033
      x-req: [REQ-016]
      x-tier: P0
